name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          A63B7A: ${{ secrets.A63B7A }}
          BED29F: ${{ secrets.BED29F }}
        run: |
          python3 -c "
          import os, pathlib, sys
          k1 = os.environ.get('A63B7A', '')
          k2 = os.environ.get('BED29F', '')
          idx = pathlib.Path('index.html')
          txt = idx.read_text(encoding='utf-8')
          out = txt.replace('<!-- d6c3f859e386c9f0ba91b29cc4132e66d4c660f2250d54 -->', k1) if k1 else txt
          out = out.replace('<!-- 295608350463384f785f432734 -->', k2) if k2 else out
          if out == txt and (k1 or k2):
              sys.exit(1)
          if out != txt:
              idx.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
